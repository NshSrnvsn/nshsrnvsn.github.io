<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little something for you</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F6EFE3;
    --cream-deep: #EFE4D0;
    --envelope: #C89A76;
    --envelope-dark: #B4855E;
    --envelope-flap: #D6AC85;
    --ink: #3A2E2C;
    --ink-soft: #6B5B54;
    --sage: #7C8B6F;
    --sage-dark: #56634B;
    --rose: #C97B84;
    --rose-dark: #A85862;
    --paper-line: rgba(58,46,44,0.14);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.5), transparent 40%),
      var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:'Jost', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .hint{
    font-family:'Caveat', cursive;
    font-size:22px;
    color:var(--ink-soft);
    margin-bottom:22px;
    text-align:center;
    letter-spacing:0.3px;
    transition:opacity 0.4s ease;
  }
  .hint.hidden{opacity:0;height:0;margin:0;overflow:hidden;}

  /* ===================== ENVELOPE ===================== */
  .envelope-wrap{
    position:relative;
    width:340px;
    height:230px;
    perspective:1400px;
  }
  .envelope-wrap.gone{ display:none; }

  .envelope{
    position:absolute;
    inset:0;
    cursor:pointer;
  }

  .env-shadow{
    position:absolute;
    left:8%;
    right:8%;
    bottom:-14px;
    height:20px;
    background:radial-gradient(ellipse at center, rgba(58,46,44,0.25), transparent 70%);
    filter:blur(2px);
  }

  .env-body{
    position:absolute;
    inset:0;
    background:var(--envelope);
    border-radius:6px;
    box-shadow: 0 10px 24px rgba(58,46,44,0.18);
  }

  .env-pocket-left, .env-pocket-right, .env-pocket-bottom{
    position:absolute;
    background:var(--envelope-dark);
  }
  .env-pocket-bottom{
    left:0; right:0; bottom:0; height:60%;
    clip-path:polygon(0 100%, 100% 100%, 100% 0, 50% 45%, 0 0);
    background:var(--envelope-dark);
    border-radius:0 0 6px 6px;
  }

  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:60%;
    background:var(--envelope-flap);
    clip-path:polygon(0 0, 100% 0, 50% 78%);
    transform-origin:top center;
    transform-style:preserve-3d;
    transition:transform 0.9s cubic-bezier(.6,-0.15,.2,1.2);
    z-index:5;
    border-radius:6px 6px 0 0;
  }
  .env-flap::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,0.18), transparent 60%);
  }

  .envelope.open .env-flap{
    transform:rotateX(178deg);
    z-index:1;
  }

  .seal{
    position:absolute;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%);
    width:54px;
    height:54px;
    border-radius:50%;
    background:var(--rose);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 6px rgba(58,46,44,0.35), inset 0 2px 3px rgba(255,255,255,0.25), inset 0 -3px 4px rgba(0,0,0,0.2);
    z-index:6;
    transition:transform 0.35s ease, opacity 0.35s ease;
  }
  .seal svg{ width:26px; height:26px; }
  .envelope.open .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.4);
    pointer-events:none;
  }

  .addr{
    position:absolute;
    font-family:'Caveat', cursive;
    color:#fff;
    z-index:4;
    line-height:1.35;
  }
  .addr .lbl{
    font-family:'Jost', sans-serif;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0.75;
    display:block;
    margin-bottom:2px;
  }
  .addr[contenteditable="true"]{
    outline:none;
    cursor:text;
    border-bottom:1px dashed rgba(255,255,255,0.4);
    padding-bottom:2px;
  }
  .addr-to{
    left:20px;
    bottom:16px;
    font-size:20px;
    max-width:160px;
  }
  .addr-from{
    right:20px;
    top:16px;
    font-size:16px;
    text-align:right;
    max-width:140px;
    opacity:0.92;
  }

  .stamp{
    position:absolute;
    top:14px;
    left:18px;
    width:44px;
    height:54px;
    background:repeating-linear-gradient(45deg, var(--sage) 0 4px, var(--sage-dark) 4px 8px);
    border:3px dotted rgba(255,255,255,0.6);
    border-radius:2px;
    z-index:4;
    opacity:0.9;
  }

  /* ===================== CARD ===================== */
  .card-wrap{
    width:340px;
    height:440px;
    perspective:1600px;
    opacity:0;
    transform:translateY(40px) scale(0.9);
    transition:opacity 0.7s ease 0.15s, transform 0.7s cubic-bezier(.2,.8,.2,1) 0.15s;
    margin-top:0;
  }
  .card-wrap.visible{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.6,-0.1,.2,1.1);
  }
  .card.flipped{ transform:rotateY(180deg); }

  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:4px;
    background:var(--cream-deep);
    box-shadow:0 18px 36px rgba(58,46,44,0.22), 0 2px 8px rgba(58,46,44,0.12);
    border:1px solid var(--paper-line);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:34px 26px;
  }

  .card-front{
    justify-content:space-between;
  }
  .card-front::before{
    content:'';
    position:absolute;
    inset:10px;
    border:1px solid var(--paper-line);
    pointer-events:none;
  }

  .vase-illustration{
    width:150px;
    height:170px;
    margin-top:18px;
  }

  .front-caption{
    width:100%;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:23px;
    color:var(--ink);
    line-height:1.4;
    outline:none;
    padding:6px 4px;
    border-bottom:1px dashed transparent;
    transition:border-color 0.2s ease;
    margin-bottom:6px;
  }
  .front-caption:hover, .front-caption:focus{
    border-bottom:1px dashed var(--ink-soft);
  }

  .tap-note{
    font-family:'Jost', sans-serif;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.55;
  }

  .card-back{
    transform:rotateY(180deg);
    background:var(--cream);
    justify-content:flex-start;
    align-items:stretch;
    padding:30px 30px 22px;
  }
  .card-back::before{
    content:'';
    position:absolute;
    inset:8px;
    border:1px solid var(--paper-line);
    pointer-events:none;
  }

  .inner-message{
    flex:1;
    width:100%;
    font-family:'Caveat', cursive;
    font-size:26px;
    line-height:1.55;
    color:var(--ink);
    outline:none;
    resize:none;
    overflow-y:auto;
    overflow-x:hidden;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    padding:6px 2px 14px;
    scrollbar-width:thin;
  }
  .inner-message:empty::before{
    content:attr(data-placeholder);
    color:var(--ink-soft);
    opacity:0.55;
  }
  .inner-message::-webkit-scrollbar{
    width:8px;
  }
  .inner-message::-webkit-scrollbar-thumb{
    background:rgba(58,46,44,0.2);
    border-radius:999px;
  }
  .inner-message::-webkit-scrollbar-track{
    background:transparent;
  }

  .inner-signoff{
    font-family:'Caveat', cursive;
    font-size:22px;
    text-align:right;
    color:var(--ink-soft);
    outline:none;
    padding:4px 2px;
    align-self:flex-end;
  }

  .back-hint{
    position:absolute;
    bottom:8px;
    left:0;
    right:0;
    text-align:center;
    font-family:'Jost', sans-serif;
    font-size:9px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.4;
  }

  [contenteditable="true"]:focus{
    background:rgba(255,255,255,0.35);
  }

  @media (max-width:400px){
    .envelope-wrap{ width:88vw; height:190px; }
    .card-wrap{ width:88vw; height:400px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="hint" id="hint">tap the seal to open your letter</div>

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="env-shadow"></div>
    <div class="envelope" id="envelope">
      <div class="env-body"></div>
      <div class="stamp"></div>

      <div class="addr addr-from" contenteditable="true" spellcheck="false">

        <div class="front-caption" contenteditable="true" spellcheck="false">for someone who means a lot</div>

        <div class="back-hint">tap to close</div>
      </div>

    </div>
  </div>
</div>

<script>
  const envelope = document.getElementById('envelope');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const cardWrap = document.getElementById('cardWrap');
  const card = document.getElementById('card');
  const hint = document.getElementById('hint');

  let opened = false;
  envelope.addEventListener('click', (e) => {
    if(e.target.closest('[contenteditable]')) return;
    if(opened) return;
    opened = true;
    envelope.classList.add('open');
    hint.textContent = 'tap the card to read it';
    setTimeout(() => {
      cardWrap.classList.add('visible');
    }, 500);
    setTimeout(() => {
      envelopeWrap.classList.add('gone');
    }, 900);
  });

  card.addEventListener('click', (e) => {
    if(e.target.closest('[contenteditable]')) return;
    card.classList.toggle('flipped');
    hint.classList.add('hidden');
  });
</script>

</body>
</html>
